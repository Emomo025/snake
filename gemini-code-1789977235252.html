<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classic Snake Game</title>
    <style>
        body {
            background-color: #1a1a24;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }

        .game-container {
            text-align: center;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 400px;
            margin-bottom: 12px;
            font-size: 1.2rem;
            font-weight: bold;
        }

        .score-board {
            background-color: #2a2a38;
            padding: 8px 16px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .score-board span {
            color: #4CAF50;
        }

        canvas {
            background-color: #0f0f17;
            border: 4px solid #2a2a38;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
            display: block;
        }

        .controls-hint {
            margin-top: 16px;
            color: #a0a0b0;
            font-size: 0.9rem;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 12px;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="header">
            <div class="score-board">Score: <span id="score">0</span></div>
            <div class="score-board">High Score: <span id="high-score">0</span></div>
        </div>

        <canvas id="gameCanvas" width="400" height="400"></canvas>

        <button class="btn" id="restartBtn" onclick="resetGame()">Restart Game</button>
        <div class="controls-hint">Use <strong>Arrow Keys</strong> or <strong>WASD</strong> to navigate</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('high-score');

        // Grid & Game parameters
        const gridSize = 20;
        const tileCount = canvas.width / gridSize;
        const gameSpeed = 100; // milliseconds per frame

        // Game state
        let snake = [];
        let food = { x: 0, y: 0 };
        let dx = gridSize;
        let dy = 0;
        let score = 0;
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        let gameInterval = null;
        let isGameOver = false;
        let changingDirection = false; // Prevents fast double-key self-collisions

        highScoreElement.textContent = highScore;

        function startGame() {
            snake = [
                { x: 160, y: 200 },
                { x: 140, y: 200 },
                { x: 120, y: 200 }
            ];
            dx = gridSize;
            dy = 0;
            score = 0;
            isGameOver = false;
            scoreElement.textContent = score;
            spawnFood();
            
            if (gameInterval) clearInterval(gameInterval);
            gameInterval = setInterval(gameLoop, gameSpeed);
        }

        function gameLoop() {
            if (isGameOver) return;

            changingDirection = false;
            clearCanvas();
            moveSnake();
            checkCollision();

            if (!isGameOver) {
                drawFood();
                drawSnake();
            }
        }

        function clearCanvas() {
            ctx.fillStyle = '#0f0f17';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            snake.forEach((part, index) => {
                // Head is brighter green, body is regular green
                ctx.fillStyle = index === 0 ? '#66BB6A' : '#4CAF50';
                ctx.strokeStyle = '#0f0f17';
                
                // Draw rounded rectangles for smooth look
                ctx.beginPath();
                ctx.roundRect(part.x, part.y, gridSize - 1, gridSize - 1, 4);
                ctx.fill();
                ctx.stroke();
            });
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            // Check if snake eats food
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                    localStorage.setItem('snakeHighScore', highScore);
                }
                spawnFood();
            } else {
                snake.pop(); // Remove tail if no food eaten
            }
        }

        function spawnFood() {
            // Generate random grid location
            food.x = Math.floor(Math.random() * tileCount) * gridSize;
            food.y = Math.floor(Math.random() * tileCount) * gridSize;

            // Make sure food doesn't spawn on top of snake body
            snake.forEach(part => {
                if (part.x === food.x && part.y === food.y) {
                    spawnFood();
                }
            });
        }

        function drawFood() {
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(
                food.x + gridSize / 2, 
                food.y + gridSize / 2, 
                gridSize / 2 - 1, 
                0, 
                Math.PI * 2
            );
            ctx.fill();
        }

        function checkCollision() {
            const head = snake[0];

            // Wall collisions
            const hitLeftWall = head.x < 0;
            const hitRightWall = head.x >= canvas.width;
            const hitTopWall = head.y < 0;
            const hitBottomWall = head.y >= canvas.height;

            if (hitLeftWall || hitRightWall || hitTopWall || hitBottomWall) {
                triggerGameOver();
                return;
            }

            // Self collision
            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    triggerGameOver();
                    return;
                }
            }
        }

        function triggerGameOver() {
            isGameOver = true;
            clearInterval(gameInterval);

            // Overlay text
            ctx.fillStyle = 'rgba(15, 15, 23, 0.75)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#FF5252';
            ctx.font = 'bold 30px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, canvas.height / 2 - 10);

            ctx.fillStyle = '#A0A0B0';
            ctx.font = '16px "Segoe UI", sans-serif';
            ctx.fillText('Press Restart to play again', canvas.width / 2, canvas.height / 2 + 25);
        }

        function changeDirection(event) {
            if (changingDirection) return;

            const keyPressed = event.key.toLowerCase();
            const goingUp = dy === -gridSize;
            const goingDown = dy === gridSize;
            const goingRight = dx === gridSize;
            const goingLeft = dx === -gridSize;

            if ((keyPressed === 'arrowleft' || keyPressed === 'a') && !goingRight) {
                dx = -gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 'arrowup' || keyPressed === 'w') && !goingDown) {
                dx = 0;
                dy = -gridSize;
                changingDirection = true;
            }
            if ((keyPressed === 'arrowright' || keyPressed === 'd') && !goingLeft) {
                dx = gridSize;
                dy = 0;
                changingDirection = true;
            }
            if ((keyPressed === 'arrowdown' || keyPressed === 's') && !goingUp) {
                dx = 0;
                dy = gridSize;
                changingDirection = true;
            }
        }

        function resetGame() {
            startGame();
        }

        document.addEventListener('keydown', changeDirection);

        // Start game on initial load
        startGame();
    </script>
</body>
</html>
